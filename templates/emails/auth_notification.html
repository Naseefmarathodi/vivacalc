{% comment %}
Email HTML: tables and inline styles only. Mail clients strip <style> blocks,
so this cannot share the app stylesheet. Colours are the Viva brand values.
Content is deliberately limited to username and time.
{% endcomment %}
<!DOCTYPE html>
<html lang="en">
<head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"></head>
<body style="margin:0;padding:0;background:#f1f4f7;font-family:-apple-system,BlinkMacSystemFont,'Segoe UI',Roboto,Helvetica,Arial,sans-serif;color:#16202b;">
  <table role="presentation" width="100%" cellpadding="0" cellspacing="0" style="background:#f1f4f7;padding:24px 12px;">
    <tr><td align="center">
      <table role="presentation" width="100%" cellpadding="0" cellspacing="0" style="max-width:460px;background:#ffffff;border:1px solid #e3e8ed;border-radius:8px;overflow:hidden;">

        <tr><td style="height:4px;background:#EC1C24;font-size:0;line-height:0;">&nbsp;</td></tr>

        <tr><td style="padding:22px 26px 4px;">
          <div style="font-size:11px;font-weight:700;letter-spacing:.12em;text-transform:uppercase;color:{% if event == 'login' %}#0F6E42{% else %}#66727f{% endif %};">
            {{ event_label }}
          </div>
        </td></tr>

        <tr><td style="padding:10px 26px 22px;">
          <table role="presentation" width="100%" cellpadding="0" cellspacing="0" style="font-size:14px;border-collapse:collapse;">
            <tr>
              <td style="padding:9px 0;color:#66727f;width:70px;border-bottom:1px solid #eef1f4;">User</td>
              <td style="padding:9px 0;font-weight:700;border-bottom:1px solid #eef1f4;">{{ username }}</td>
            </tr>
            <tr>
              <td style="padding:9px 0;color:#66727f;">Time</td>
              <td style="padding:9px 0;font-weight:600;">{{ timestamp_display }}</td>
            </tr>
          </table>
        </td></tr>

        <tr><td style="padding:12px 26px;background:#f7f9fb;border-top:1px solid #e3e8ed;font-size:11px;color:#8a96a3;">
          Automated message from {{ app_name }} &mdash; {{ brand_name }}.
        </td></tr>

      </table>
    </td></tr>
  </table>
</body>
</html>
