{# Empty state. Pass title, body and optionally action_url + action_label. #}
<div class="empty">
  <svg class="empty__icon" viewBox="0 0 24 24" fill="none" stroke="currentColor"
       stroke-width="1.5" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true">
    <path d="M3 7h18v13a1 1 0 0 1-1 1H4a1 1 0 0 1-1-1z"/>
    <path d="M3 7l2-4h14l2 4M9 12h6"/>
  </svg>
  <h3>{{ title }}</h3>
  <p>{{ body }}</p>
  {% if action_url %}
    <a class="btn btn--primary" href="{{ action_url }}">{{ action_label }}</a>
  {% endif %}
</div>
