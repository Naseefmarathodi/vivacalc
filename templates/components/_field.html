{# One form field, rendered consistently everywhere. #}
<div class="field {% if field.errors %}has-error{% endif %} {% if field.field.widget.input_type == 'checkbox' %}checkbox{% endif %}">
  {% if field.field.widget.input_type == 'checkbox' %}
    {{ field }}
    <label for="{{ field.id_for_label }}">{{ field.label }}</label>
  {% else %}
    <label for="{{ field.id_for_label }}">
      {{ field.label }}{% if field.field.required %} <span class="req" aria-hidden="true">*</span>{% endif %}
    </label>
    {{ field }}
  {% endif %}
  {% if field.help_text %}<span class="help">{{ field.help_text }}</span>{% endif %}
  {% if field.errors %}<div class="errors">{{ field.errors|striptags }}</div>{% endif %}
</div>
